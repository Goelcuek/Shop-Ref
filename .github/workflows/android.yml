name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Calculation engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core unit tests
        run: ./gradlew -p core test --console=plain
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/shop-ref-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/shop-ref-release.apk
          ls -la dist
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shop-ref-apk
          path: dist/*.apk
      - name: Publish GitHub release
        # On a pushed v* tag, or on a manual run with a release_tag input (the release creates the tag).
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Shop Ref ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Offline machining reference and feeds & speeds calculator for Android 8.0+.

            **Install:** download `shop-ref-release.apk` on the phone, open it and allow "install unknown apps".
            `shop-ref-debug.apk` installs side by side (package `com.shopref.app.debug`) for testing.

            Includes milling, drilling/reaming, tapping/thread milling and turning calculators with cutting-force,
            torque, power and deflection predictions, plus tap drill, drill size, clearance hole, counterbore,
            ISO 286 fits, hardness and surface-finish references. Results are starting points — verify against
            your tool manufacturer's data.

  ui-smoke-test:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    needs: core-tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: app/build/reports/androidTests
          if-no-files-found: ignore
