name: Website

on:
  push:
    branches: ["**"]
    paths:
      - "core/**"
      - "web/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "core/**"
      - "web/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile calculation engine to JavaScript
        run: ./gradlew -p core compileProductionExecutableKotlinJs --console=plain
      - name: Check translations
        run: python3 tools/check_i18n.py
      - name: Bundle single-file page
        run: python3 web/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node web/test/smoke.js web/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages (GitHub Actions source)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
